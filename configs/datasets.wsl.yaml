# Registro para treino dentro do Ubuntu WSL. Os datasets ficam no filesystem
# Linux nativo, evitando a enumeração/leitura de milhares de arquivos por /mnt/c.
# Use este arquivo somente a partir do WSL com --registry configs/datasets.wsl.yaml.
datasets:
  mnist: {adapter: mnist, root: /home/msduda/datasets-tcc/mnist}
  fashion_mnist: {adapter: fashion_mnist, root: /home/msduda/datasets-tcc/fashion_mnist}
  kmnist: {adapter: kmnist, root: /home/msduda/datasets-tcc/kmnist}
  emnist_balanced: {adapter: emnist_balanced, root: /home/msduda/datasets-tcc/emnist_balanced}
  cifar10: {adapter: cifar10, root: /home/msduda/datasets-tcc/cifar10}
  cifar100_coarse: {adapter: cifar100_coarse, root: /home/msduda/datasets-tcc/cifar100_coarse}
  svhn: {adapter: svhn, root: /home/msduda/datasets-tcc/svhn}
  gtsrb: {adapter: gtsrb, root: /home/msduda/datasets-tcc/gtsrb}
  fer2013: {adapter: fer2013, root: /home/msduda/datasets-tcc/fer2013}
