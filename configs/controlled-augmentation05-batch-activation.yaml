# Rodada controlada: selecao de batch e ativacoes, sem quantizacao.
# A augmentation mantem a politica da rodada 2.0, mas gera apenas 0.5x
# exemplos sinteticos por epoca (em vez de 2.0x).
suite:
  output_root: ../outputs/controlled-augmentation05-batch-activation
  seeds: [42]
  normalizations: [unit_interval]
  balance_modes: [all_raw]
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  hardware_interval_seconds: 5.0
  training:
    max_epochs: 100
    batch_size: 32
    learning_rate: 0.0003
    extra_fraction: 0.5
    dtype_policy: mixed_float16
    hidden_activation: swish
    keras_verbose: 1
    default_image_size: 64
    image_size_overrides: {gtsrb: 128}
    augmentation: {flip_lr: true, brightness_delta: 0.03, contrast_lower: 0.92, contrast_upper: 1.08, translate_frac: 0.05, zoom_min: 0.96, zoom_max: 1.04, noise_std: 0.005, cutout_prob: 0.25, cutout_max_frac: 0.08}
    preprocess_cache_max_mib: 2048
    shuffle_buffer_max_mib: 1024
    # A rodada completa conserva 100 epocas para comparacao consistente.
    early_stopping_patience: 100
    reduce_lr_factor: 0.3
    reduce_lr_patience: 100
    reduce_lr_min_lr: 0.0000001
