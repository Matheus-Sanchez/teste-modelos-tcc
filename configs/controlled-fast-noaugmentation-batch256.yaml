# Continuação rápida da sequência batch -> quantização -> ativações.
# Mantém split, seed, normalização e all_raw; remove apenas a augmentation
# sintética. O supervisor gera uma cópia por dataset/variante.
suite:
  output_root: ../outputs/controlled-fast-noaugmentation-batch256
  seeds: [42]
  normalizations: [unit_interval]
  balance_modes: [all_raw]
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  hardware_interval_seconds: 5.0
  training:
    max_epochs: 100
    batch_size: 256
    learning_rate: 0.0003
    extra_fraction: 0.0
    dtype_policy: mixed_float16
    hidden_activation: swish
    keras_verbose: 1
    default_image_size: 64
    image_size_overrides: {gtsrb: 128}
    augmentation: {flip_lr: false, brightness_delta: 0.0, contrast_lower: 1.0, contrast_upper: 1.0, translate_frac: 0.0, zoom_min: 1.0, zoom_max: 1.0, noise_std: 0.0, cutout_prob: 0.0, cutout_max_frac: 0.0}
    # O cache ocorre antes da augmentation. Como esta suite não aumenta imagens,
    # ele reduz recodificação sem alterar os exemplos usados pelo modelo.
    preprocess_cache_max_mib: 2048
    # Limite explícito para os dois buffers de embaralhamento, evitando pressionar
    # a RAM compartilhada entre Windows e WSL em datasets grandes.
    shuffle_buffer_max_mib: 1024
    # Mantém exatamente 100 épocas para comparabilidade entre as três etapas.
    early_stopping_patience: 100
    reduce_lr_factor: 0.3
    reduce_lr_patience: 100
    reduce_lr_min_lr: 0.0000001
